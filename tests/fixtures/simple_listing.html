<!DOCTYPE html>
<html lang="en">
<head><title>Simple Shop</title></head>
<body>
  <h1>Products</h1>
  <div class="product-list">
    <div class="product-card">
      <a href="/products/widget-pro">
        <img src="https://cdn.example.com/widget-pro.jpg" alt="Widget Pro">
        <h2 class="product-name">Widget Pro</h2>
      </a>
      <span class="product-price">$29.99</span>
      <p class="product-description">The best widget for professionals.</p>
    </div>
    <div class="product-card">
      <a href="/products/gadget-lite">
        <img src="https://cdn.example.com/gadget-lite.jpg" alt="Gadget Lite">
        <h2 class="product-name">Gadget Lite</h2>
      </a>
      <span class="product-price">$14.99</span>
      <p class="product-description">A lightweight gadget for everyday use.</p>
    </div>
  </div>
  <a href="/products?page=2" class="pagination-next">Next Page</a>
</body>
</html>
