<!DOCTYPE html>
<html lang="en">
<head><title>Tailwind Shop</title></head>
<body class="bg-gray-50 font-sans">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <h1 class="text-3xl font-bold text-gray-900 mb-8">Our Products</h1>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <div class="bg-white rounded-lg shadow-md overflow-hidden hover:shadow-lg transition-shadow duration-300 product-card">
        <a href="/products/headphones-x1" class="block">
          <img
            src="/_next/image?url=https%3A%2F%2Fcdn.shop.com%2Fheadphones-x1.jpg&w=800&q=75"
            srcset="/_next/image?url=https%3A%2F%2Fcdn.shop.com%2Fheadphones-x1.jpg&w=400&q=75 400w, /_next/image?url=https%3A%2F%2Fcdn.shop.com%2Fheadphones-x1.jpg&w=800&q=75 800w"
            class="w-full h-64 object-cover"
            alt="Headphones X1"
            data-nimg="1"
          >
          <div class="p-6">
            <h3 class="text-lg font-semibold text-gray-900 product-name">Headphones X1</h3>
            <p class="text-gray-600 text-sm mt-2 product-description">Premium noise-cancelling headphones with 30hr battery.</p>
            <div class="flex items-center justify-between mt-4">
              <span class="text-2xl font-bold text-indigo-600 product-price">$199.00</span>
              <span class="text-sm text-yellow-500 product-rating">★ 4.8 (312 reviews)</span>
            </div>
          </div>
        </a>
      </div>
    </div>
  </div>
</body>
</html>
