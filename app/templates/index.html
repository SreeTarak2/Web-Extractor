<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebMind Extractor</title>
  <link rel="stylesheet" href="/static/style.css" />
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="app-container">
    <header>
      <h1>WebMind Extractor</h1>
      <p class="subtitle">AI-powered web data extraction</p>
    </header>

    <!-- Chat Area -->
    <div id="chat-area" class="chat-area">
      <div class="chat-empty">Enter a URL below to start scraping...</div>
    </div>

    <!-- Prompt Box - React Style -->
    <div class="prompt-input-wrapper">
      <!-- File Previews -->
      <div id="file-previews" class="file-previews"></div>
      
      <!-- Textarea -->
      <div class="textarea-container">
        <textarea 
          id="prompt-input" 
          placeholder="Type your message here..."
          rows="1"
        ></textarea>
      </div>

      <!-- Actions Row -->
      <div class="prompt-actions">
        <div class="action-buttons-left">
          <!-- Upload Button -->
          <button class="action-btn" id="upload-btn" title="Upload image">
            <i data-lucide="paperclip"></i>
          </button>
          <input type="file" id="json-upload" accept=".json" class="hidden" />

          <!-- Schema Selector -->
          <button class="toggle-btn" id="schema-toggle">
            <span id="schema-label">Contest</span>
            <i data-lucide="chevron-down" class="chevron"></i>
          </button>
          <div id="schema-dropdown" class="dropdown hidden">
            <div class="dropdown-item" data-value="contest">Contest</div>
            <div class="dropdown-item" data-value="conference">Conference</div>
          </div>

          <!-- Batch Size -->
          <div class="batch-input-wrapper">
            <span class="batch-label">Batches:</span>
            <input type="number" id="batch-size" value="5" min="1" max="50" />
          </div>

          <!-- Divider -->
          <div class="custom-divider"></div>

          <!-- Search Toggle -->
          <button class="toggle-btn search-toggle" id="search-toggle" title="Search">
            <i data-lucide="globe"></i>
            <span class="toggle-label">Search</span>
          </button>

          <!-- Think Toggle -->
          <button class="toggle-btn think-toggle" id="think-toggle" title="Think">
            <i data-lucide="brain-circuit"></i>
            <span class="toggle-label">Think</span>
          </button>
        </div>

        <!-- Send Button -->
        <button class="send-btn" id="send-btn">
          <i data-lucide="send"></i>
        </button>
      </div>
    </div>
  </div>

  <script src="/static/app.js?v=4"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
