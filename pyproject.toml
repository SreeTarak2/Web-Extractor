[project]
name = "webmind-extractor"
version = "0.1.0"
description = "AI-powered web data extractor"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "openai>=1.0.0",
    "playwright==1.49.1",
    "jinja2==3.1.5",
    "python-multipart==0.0.18",
    "aiofiles==24.1.0",
    "python-dotenv==1.0.1",
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.scripts]
webmind = "cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
